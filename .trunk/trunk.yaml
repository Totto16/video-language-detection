# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - gitleaks@8.29.0
    - cspell@10.0.1
    - snyk@1.1295.0
    - stylelint@17.13.0
    - pre-commit-hooks@6.0.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.1
    - git-diff-check
    - grype@0.114.0
    - isort@8.0.1
    - markdownlint@0.48.0
    - mypy@2.1.0
    - osv-scanner@2.3.8
    - oxipng@10.1.1
    - pinact@4.1.0
    - prettier@3.8.4
    - ruff@0.15.17
    - taplo@0.10.0
    - trufflehog@3.95.5
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
tools:
  enabled:
    - stylelint@17.13.0
    - snyk@1.1295.0
    - gitleaks@8.29.0
    - cspell@10.0.1
    - tsc@6.0.3
    - ts-node@10.9.2
    - eslint@10.4.1
    - pnpm@11.6.0
  runtimes:
    - python
    - node
